<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Glucose and fluorine-18 FDG in matching ring representations</title>
  <desc id="description">Both molecules have the same six-membered ring containing one oxygen atom. At carbon two, glucose has an OH group, whereas FDG has fluorine-18. This simplified connectivity drawing omits stereochemistry and carbon-bound hydrogen atoms.</desc>
  <rect width="900" height="440" fill="white"/>
  <defs>
    <g id="ring" stroke="#303640" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M140 120 L224 120 M253 141 L290 205 L240 290 L140 290 L90 205 L140 120"/>
      <path d="M140 120 L115 76 M290 205 L337 205 M140 290 L110 330 M90 205 L44 205"/>
    </g>
    <g id="groups" font-family="Arial, sans-serif" font-size="25" fill="#303640" text-anchor="middle">
      <text x="240" y="130" fill="#b52525">O</text>
      <text x="104" y="63">CH₂OH</text>
      <text x="363" y="214">OH</text>
      <text x="99" y="357">OH</text>
      <text x="24" y="214">HO</text>
    </g>
  </defs>
  <g transform="translate(40 30)">
    <text x="195" y="10" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#202020">Glucose</text>
    <use href="#ring"/><use href="#groups"/>
    <path d="M240 290 L265 335" stroke="#287c8e" stroke-width="4"/>
    <ellipse cx="280" cy="356" rx="39" ry="27" fill="#e4f4f7"/>
    <text x="280" y="365" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#175664">OH</text>
  </g>
  <g transform="translate(490 30)">
    <text x="195" y="10" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#202020">FDG</text>
    <use href="#ring"/><use href="#groups"/>
    <path d="M240 290 L265 335" stroke="#b64c20" stroke-width="4"/>
    <ellipse cx="280" cy="356" rx="39" ry="27" fill="#fff0e5"/>
    <text x="280" y="365" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#9b3912">¹⁸F</text>
  </g>
  <text x="450" y="425" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#505050">Same ring structure; highlighted change: OH → fluorine-18</text>
</svg>
